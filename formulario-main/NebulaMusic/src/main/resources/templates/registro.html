<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->
            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
                <!-- Escribe tus etiquetas (label) e inputs aquí -->
                <h1>Crear cuenta</h1>
                <div>
                    <label for="nombre">Nombre Completo: </label>
                    <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ramses Norberto"
                            required
                            minlength="3"
                            maxlength="100"
                    >

                </div>
                <div>
                    <label for="contrasenia">Contraseña: </label>
                    <input
                            type="password"
                            id="contrasenia"
                            name="contrasenia"
                            placeholder="******"
                            required
                    >
                </div>
                <div>
                    <label for="correo">Correo Electronico: </label>
                    <input
                            type="email"
                            id="correo"
                            name="correo"
                            required
                            placeholder="correo@gmail.com"
                    >
                </div>
                <div>
                    <label for="pseudonimo">Alias: </label>
                    <input
                            type="text"
                            id="pseudonimo"
                            name="alias"
                            required
                            pattern="[A-Za-z]{3,10}-[0-9]{2,10}"
                            placeholder="Tilin67"
                    >
                </div>
                <div>
                    <label>Genero</label>
                    <div>
                        <input type="radio" id="rad_femenino" name="genero" value="femenino" required>
                        <label for="rad_femenino">Femenino</label>
                        <input type="radio" id="rad_masculino" name="genero" value="masculino" required>
                        <label for="rad_masculino">Masculino</label>
                        <input type="radio" id="rad_helicoptero_apache_con_misiles_teleridigidos" name="genero" value="helicoptero" required>
                        <label for="rad_helicoptero_apache_con_misiles_teleridigidos">Helicoptero apache con misiles teleridigidos</label>
                    </div>
                </div>
                <div>
                    <label for="suscripcion">Tipo de suscripcion:</label>
                    <select name="suscripcion" id="suscripcion" required>
                        <option value="">-- Selecciona una opcion --</option>
                        <option value="gratis">Gratis con anuncios</option>
                        <option value="premium_mensual">Premium mensual $67/mes</option>
                        <option value="premium_anual">Premium anual $6767/año</option>
                    </select>
                </div>
                <div>
                    <label for="fecha_nacimiento">Fecha de nacimiento: </label>
                    <input
                            type="date"
                            id="fecha_nacimiento"
                            name="fecha_nacimiento"
                            required
                    >
                </div>
                <div>
                    <input type="checkbox" id="terminos" name="terminos" value="aceptado" required>
                    <label for="terminos">Acepto los terminos y conediciones de uso</label>
                </div>
                <div>
                    <label for="comentarios">Comentarios y preferencias</label>
                    <textarea
                            name="comentarios"
                            id="comentarios"
                            cols="30"
                            rows="10"
                            placeholder="Cuentanos que es lo que te gusta"
                    ></textarea>
                </div>
                <div>
                    <button type="submit">Registrarse</button>
                    <button type="reset">Limpiar formulario</button>
                </div>
            </form>
            <p>
                ¿Ya tienes una cuenta? <a href="iniciar-sesion.html">Inicia sesion aqui</a>
            </p>

        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
