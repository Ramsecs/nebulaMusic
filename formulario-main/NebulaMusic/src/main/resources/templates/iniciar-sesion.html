<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <div class="form-logo">
                <img src="../static/imgs/nebula-03.svg" alt="Logo Nebula">
            </div>
            <div class="form-header">
                <h3>Iniciar sesion</h3>
                <p class="form-subtitle">Ingresa tus cerdenciales de acceso</p>
            </div>
            <form method="post" action="/autentication" enctype="application/x-www-form-urlencoded">
                <div class="form-group">
                    <label for="correo">Correo Electronico:</label>
                    <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="correo@gmail.com"
                            required minlength="5"
                            maxlength="100"
                    >
                </div>
                <div class="form-group">
                    <label for="contraseña">Contraseña: </label>
                    <input
                            type="password"
                            id="contraseña"
                            name="contraseña"
                            placeholder="********"
                            required
                            minlength="8">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-primary">Iniciar sesion</button>
                    <button type="reset" class="btn-secondary">Limpiar formulario</button>
                </div>
            </form>
            <p>
                ¿No tienes una cuenta? <a href="registro.html.html">Inicia sesion aqui</a>
            </p>
        </section>
    </main>



</body>
</html>
